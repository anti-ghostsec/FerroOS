[package]
name = "ferro-setup"
description = "FerroOS Heavy's installer window: pick a disk, a passphrase and an account, then watch it install"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
ferro-gfx.workspace = true
ferro-ui.workspace = true
# Pure Rust: speaks the X11 protocol itself, so the binary stays static.
x11rb = { version = "0.14", default-features = false }
