[package]
name = "ferro-ladspa"
description = "FerroOS's Sound Enhancer as a LADSPA plugin, for alsa-lib's own ladspa PCM"
version.workspace = true
edition.workspace = true
license.workspace = true

# A shared library ALSA loads into every program that plays sound
# (built for the ordinary, glibc Linux those programs are).
[lib]
crate-type = ["cdylib"]

[dependencies]
ferro-dsp.workspace = true
