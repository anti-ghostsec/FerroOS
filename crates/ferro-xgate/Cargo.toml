[package]
name = "ferro-xgate"
description = "FerroOS Heavy's X11 gate: programs reach the display through it, and ask before they see the screen"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
ferro-gfx.workspace = true
ferro-ui.workspace = true
libc.workspace = true
# The popup and the self-test (probe) speak X11 themselves; the gate's own
# forwarding reads the bytes directly (wire.rs).
x11rb = { version = "0.14", default-features = false, features = ["shm", "composite", "render", "xinput", "xtest", "record"] }
