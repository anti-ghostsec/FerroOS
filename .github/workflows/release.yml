name: Build and Release FerroOS Heavy

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.0.0)'
        required: false
        default: 'v1.0.0'

permissions:
  contents: write
  # Signed build provenance for the ISO (see "Attest" below).
  id-token: write
  attestations: write

# Actions are pinned by commit: a tag can be moved to point at other code.
jobs:
  build-heavy:
    name: Build FerroOS Heavy ISO
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Before the long build: the update is signed further down, and
      # there's no release without that.
      - name: Check the signing key is there
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          [ -n "$MINISIGN_SECRET_KEY" ] || { echo "MINISIGN_SECRET_KEY isn't set: no release without a signature" >&2; exit 1; }
          sed -n 's/^PUBKEY=//p' heavy/ferro-update | grep -Eqx 'RW[A-Za-z0-9+/]{54}' ||
              { echo "heavy/ferro-update still has the placeholder for PUBKEY: put FerroOS's minisign public key there first" >&2; exit 1; }
          # What ferro-update takes for a release (and puts in order).
          printf '%s' "$TAG" | grep -Eqx 'v[0-9]{1,6}(\.[0-9]{1,6}){0,3}' ||
              { echo "$TAG isn't a release ferro-update would take (v1.2.3)" >&2; exit 1; }

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: x86_64-unknown-linux-musl

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools clang llvm qemu-system-x86 qemu-utils
          # Enable hardware acceleration if available
          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm
          fi

      # The image says which release it is (ferro-updates compares it with
      # the newest on GitHub).
      - name: Stamp the release
        run: echo "${{ github.event.inputs.tag || github.ref_name }}" > heavy/release

      # Wisp, the web browser: the commit in heavy/wisp.commit, built
      # against the image's own Debian release's WebKitGTK.
      - name: Build Wisp
        # build/ made first, so it's the runner's and not the container's
        # root's: the ISO goes there next.
        run: |
          mkdir -p build/wisp
          docker run --rm -v "$PWD:/src" -w /src debian:trixie tools/heavy/build-wisp.sh build/wisp

      # Folio, the text editor: the commit in heavy/folio.commit (Python and
      # a web page, nothing to build).
      - name: Get Folio
        run: tools/heavy/get-folio.sh build/folio

      # Leaflet, the PDF and document app: the signed release of the commit
      # in heavy/leaflet.commit, its signature checked against Leaflet's key.
      - name: Get Leaflet
        run: |
          command -v minisign >/dev/null || { sudo apt-get update -q && sudo apt-get install -y -q minisign; }
          tools/heavy/get-leaflet.sh build/leaflet

      - name: Build FerroOS Heavy ISO
        run: cargo xtask heavy-iso

      - name: Generate Checksum
        run: |
          cd build
          sha256sum ferroos-heavy.iso > ferroos-heavy.iso.sha256
          sha256sum ferroos-heavy-update.tar.gz > ferroos-heavy-update.tar.gz.sha256
          cp ../heavy/ferro-update ferro-update

      # The update bundle is signed (minisign) with FerroOS's release key:
      # ferro-update installs it only if the signature checks out against
      # the public key it carries (PUBKEY in heavy/ferro-update). The trusted
      # comment, signed too, says which release it is and when its commit
      # was made, so an installed system can't be handed an older one. The
      # checksums above stay: the ferro-update of releases before this one
      # asks for the bundle's, and hands over to the new one.
      - name: Sign the update
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          command -v minisign >/dev/null || { sudo apt-get update -q && sudo apt-get install -y -q minisign; }
          pubkey=$(sed -n 's/^PUBKEY=//p' heavy/ferro-update)
          key=$(mktemp)
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$MINISIGN_SECRET_KEY" >"$key"
          when=$(git log -1 --format=%ct "$GITHUB_SHA")
          minisign -S -s "$key" -m build/ferroos-heavy-update.tar.gz -t "ferroos $TAG $when"
          # ferro-update on its own, for whoever fetches it by hand.
          minisign -S -s "$key" -m build/ferro-update -t "ferroos-update $TAG $when"
          # Signed with the key ferro-update trusts, not some other one, and
          # taken by the ferro-update being released.
          minisign -V -P "$pubkey" -m build/ferroos-heavy-update.tar.gz
          minisign -V -P "$pubkey" -m build/ferro-update
          sh heavy/ferro-update --check build/ferroos-heavy-update.tar.gz

      # A signed statement, kept by GitHub (Sigstore), that this ISO was built
      # by this workflow from this commit. Unlike a checksum published next
      # to the file, it can't be swapped along with it. Check a download
      # with: gh attestation verify ferroos-heavy.iso --repo anti-ghostsec/FerroOS
      - name: Attest build provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: |
            build/ferroos-heavy.iso
            build/ferroos-heavy-update.tar.gz
            build/ferro-update

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: FerroOS Heavy ${{ github.event.inputs.tag || github.ref_name }}
          files: |
            build/ferroos-heavy.iso
            build/ferroos-heavy.iso.sha256
            build/ferroos-heavy-update.tar.gz
            build/ferroos-heavy-update.tar.gz.sha256
            build/ferroos-heavy-update.tar.gz.minisig
            build/ferro-update
            build/ferro-update.minisig
          draft: false
          prerelease: false
          body: |
            ## FerroOS Heavy Release

            FerroOS Heavy is a privacy-first, hardened Debian-based operating system featuring an authentic Windows 95 desktop experience with an ultra-lean memory footprint while supporting native 3D gaming, Steam/Proton, and GPU/CUDA workloads.

            ### Included Assets
            - `ferroos-heavy.iso`: Live and installable Hybrid ISO image (BIOS & UEFI Secure Boot).
            - `ferroos-heavy.iso.sha256`: SHA-256 checksum (catches a damaged download).
            - `ferroos-heavy-update.tar.gz` and its `.minisig`: what `ferro-update` fetches on an installed system, signed with FerroOS's release key.

            To check that the ISO really was built by this repository's release workflow:
            `gh attestation verify ferroos-heavy.iso --repo anti-ghostsec/FerroOS`

            ### Key Features
            - **Ultra-Lean Footprint**: Highly optimized memory footprint with full Xorg, window manager (`ferro-wm`), and system services.
            - **Preinstalled Software**: Wisp, FerroOS's own privacy web browser (with desktop shortcut), ffmpeg, FerroOS Image Viewer and Video Player (sandboxed: no internet, no running programs), Folio, FerroOS's own text editor, and Leaflet, FerroOS's own app for PDFs and documents (DOCX, ODT, RTF). Double-click a .deb or .tar.gz to install it; Add Programs installs more, including ScummVM, Wine and Tor Browser.
            - **Customizable Appearance**: Desktop and Logon wallpaper selection with live CRT monitor preview in Display Properties, retro BMP wallpapers, and customizable color schemes.
            - **Desktop & Start Menu Enhancements**: Start menu application context menus (Open, Pin to Taskbar, Create Desktop Shortcut, Uninstall), customizable desktop arrangement with Recycle Bin and Files.
            - **Privacy by Default**: Hardware kill switch tray icons (Network, Mic, Camera disabled by default), Landlock process sandboxing, seccomp network authorization prompts, and per-process RAM budgeting in Task Manager.
            - **Anti-Forensics & Duress Defense**: Optional full-disk LUKS2 encryption with Argon2id PBKDF, no sleep (closing the lid or the sleep key powers off, so the disk keys never sit in a sleeping machine's RAM), runtime DRAM page zeroing (`init_on_free=1`), and anti-coercion Duress PIN self-destruct.
            - **Hardware & Gaming**: Native Intel, AMD, and NVIDIA graphics drivers, Vulkan, CUDA/LLM acceleration, and Steam/Proton gaming out of the box.
            - **Secure Boot**: Out-of-the-box Secure Boot support via Microsoft-signed shim and signed GRUB.

      # Two releases kept: this one and the one before (to go back to).
      # Older ones' downloads go; their tags stay in the history.
      - name: Remove older releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --exclude-drafts --json tagName,publishedAt \
            --jq 'sort_by(.publishedAt) | reverse | .[2:] | .[].tagName' |
          while read -r tag; do
            echo "Removing release $tag"
            gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --yes
          done
