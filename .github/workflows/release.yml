name: Build and Release FerroOS Heavy

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.0.0)'
        required: false
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-heavy:
    name: Build FerroOS Heavy ISO
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools clang llvm qemu-system-x86 qemu-utils
          # Enable hardware acceleration if available
          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm
          fi

      - name: Build FerroOS Heavy ISO
        run: cargo xtask heavy-iso

      - name: Generate Checksum
        run: |
          cd build
          sha256sum ferroos-heavy.iso > ferroos-heavy.iso.sha256

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: FerroOS Heavy ${{ github.event.inputs.tag || github.ref_name }}
          files: |
            build/ferroos-heavy.iso
            build/ferroos-heavy.iso.sha256
          draft: false
          prerelease: false
          body: |
            ## FerroOS Heavy Release

            FerroOS Heavy is a privacy-first, hardened Debian-based operating system featuring an authentic Windows 95 desktop experience that idles under 100 MB RAM while supporting native 3D gaming, Steam/Proton, and GPU/CUDA workloads.

            ### Included Assets
            - `ferroos-heavy.iso`: Live and installable Hybrid ISO image (BIOS & UEFI Secure Boot).
            - `ferroos-heavy.iso.sha256`: SHA-256 integrity checksum.

            ### Key Features
            - **Ultra-Lean Footprint**: Idles under 100 MB RAM with full Xorg, window manager (`ferro-wm`), and system services.
            - **Privacy by Default**: Hardware kill switch tray icons (Network, Mic, Camera disabled by default), Landlock process sandboxing, seccomp network authorization prompts, and per-process RAM budgeting in Task Manager.
            - **Anti-Forensics & Duress Defense**: Optional full-disk LUKS2 encryption with Argon2id PBKDF, encrypted suspend with in-RAM master key eviction, runtime DRAM page zeroing (`init_on_free=1`), and anti-coercion Duress PIN self-destruct.
            - **Hardware & Gaming**: Native Intel, AMD, and NVIDIA graphics drivers, Vulkan, CUDA/LLM acceleration, and Steam/Proton gaming out of the box.
            - **Secure Boot**: Out-of-the-box Secure Boot support via Microsoft-signed shim and signed GRUB.
