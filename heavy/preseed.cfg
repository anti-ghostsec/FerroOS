# FerroOS Heavy: answers for Debian's installer. `cargo xtask heavy-iso` puts
# this file and the rest of heavy/ into the network installer's initrd, where
# the installer picks it up by itself.
#
# Still asked, because only you can answer: language and keyboard, your name
# and password, which disk to erase, and the disk encryption passphrase.

# ---- Network: one machine name for everyone, so it identifies nobody.
d-i netcfg/get_hostname string ferro
d-i netcfg/get_domain string
d-i netcfg/hostname string ferro

# ---- Packages come over HTTPS, so the network can't see which ones.
d-i mirror/country string manual
d-i mirror/protocol string https
d-i mirror/https/hostname string deb.debian.org
d-i mirror/https/directory string /debian
d-i mirror/https/proxy string
d-i mirror/suite string @SUITE@
# The NVIDIA driver, Steam and firmware aren't in Debian's free section.
d-i apt-setup/contrib boolean true
d-i apt-setup/non-free boolean true
d-i apt-setup/non-free-firmware boolean true
d-i apt-setup/services-select multiselect security, updates
d-i apt-setup/security_host string security.debian.org

# ---- Accounts: no root password; your account uses sudo.
d-i passwd/root-login boolean false

# ---- Disk: everything but /boot inside LUKS2. Which disk, and the final
# "write changes" question, are left for you.
d-i partman-auto/method string crypto
d-i partman-auto-lvm/guided_size string max
d-i partman-auto/choose_recipe select atomic
# Overwriting the whole disk with random data first takes hours.
d-i partman-auto-crypto/erase_disks boolean false

# ---- Software: the base system only; the list below adds the desktop.
tasksel tasksel/first multiselect standard
d-i pkgsel/include string @PACKAGES@
d-i pkgsel/upgrade select full-upgrade
d-i pkgsel/update-policy select unattended-upgrades
popularity-contest popularity-contest/participate boolean false

# ---- Boot loader: Debian's signed one, so Secure Boot can stay on.
d-i grub-installer/only_debian boolean true
d-i grub-installer/with_other_os boolean true

# ---- Then the hardening and the Windows 95 look (heavy/postinstall.sh).
d-i preseed/late_command string mkdir -p /target/usr/local/share/ferro-heavy; cp -a /heavy/. /target/usr/local/share/ferro-heavy/; in-target sh /usr/local/share/ferro-heavy/postinstall.sh
