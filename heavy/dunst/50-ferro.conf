# FerroOS: notifications as Windows shows them. A grey box with a black
# frame in the bottom-right corner, above the taskbar, that goes after a
# few seconds. What was shown is kept in memory only (never on the disk),
# for the Notifications window (Windows+N) until you log off.
[global]
    follow = none
    origin = bottom-right
    offset = (10, 50)
    width = 340
    height = (0, 160)
    notification_limit = 4
    gap_size = 6
    padding = 10
    horizontal_padding = 12
    text_icon_padding = 10
    frame_width = 2
    frame_color = "#000000"
    separator_color = frame
    corner_radius = 0
    font = "DejaVu Sans 10"
    markup = full
    format = "<b>%s</b>\n%b"
    alignment = left
    word_wrap = yes
    ellipsize = end
    icon_position = left
    min_icon_size = 0
    max_icon_size = 32
    show_age_threshold = 60
    idle_threshold = 120
    sticky_history = yes
    history_length = 50
    mouse_left_click = do_action, close_current
    mouse_middle_click = close_all
    mouse_right_click = close_current
    dmenu = /bin/false
    browser = /bin/false

[urgency_low]
    background = "#c0c0c0"
    foreground = "#000000"
    timeout = 5

[urgency_normal]
    background = "#c0c0c0"
    foreground = "#000000"
    timeout = 7

[urgency_critical]
    background = "#ffffff"
    foreground = "#000000"
    frame_color = "#c00000"
    timeout = 0
