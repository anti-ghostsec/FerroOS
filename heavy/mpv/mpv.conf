# FerroOS Video Player: mpv as ferro-video starts it. Debian's own mpv
# settings (/etc/mpv) are left as they are; these come on top.

# Silent until you turn it up.
volume=0
# Each video plays round and round; Left and Right go to the others in its
# folder (the last wraps round to the first).
loop-file=inf
loop-playlist=inf
autocreate-playlist=filter
directory-filter-types=video
# Only that folder's own videos: its subfolders would otherwise join the
# playlist and open, recursively, everything inside them.
directory-mode=ignore
# Clicking the timeline goes exactly there, not to the nearest keyframe.
hr-seek=yes
# Decoded on the graphics card when it can (VA-API, mesa-va-drivers), on
# the processor when it can't: "safe" only takes what's known to decode
# right, so a card that gets it wrong never shows a broken picture.
hwdec=auto-safe
# Nothing is fetched: links aren't played (and ferro-jail blocks the internet).
ytdl=no

# The control bar (osc.lua) and the menu (ferro-menu.lua) are FerroOS's own,
# drawn like Windows 95. mpv's own messages (volume, seeking) in the same font.
osd-font="DejaVu Sans"
