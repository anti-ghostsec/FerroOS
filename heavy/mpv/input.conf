# FerroOS Video Player's keys (on top of mpv's own).
RIGHT       playlist-next             # the next video in the folder
LEFT        playlist-prev             # the one before
Shift+RIGHT seek 5 exact              # forward and back within a video
Shift+LEFT  seek -5 exact
UP          add volume 5
DOWN        add volume -5
DEL         script-binding ferro_delete/ask
l           ab-loop                   # A-B loop: set A, set B, off
MBTN_RIGHT  script-binding ferro_menu/menu
MBTN_LEFT   no-osd cycle pause        # click the picture: pause, play (nothing drawn)
