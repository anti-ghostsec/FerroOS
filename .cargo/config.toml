[alias]
xtask = "run --quiet -p xtask --"

# FerroOS binaries are fully static musl executables. rust-lld plus the
# self-contained musl CRT shipped with rustup lets us link them from any host,
# including Windows, without a cross gcc.
[target.x86_64-unknown-linux-musl]
linker = "rust-lld"
rustflags = ["-C", "target-feature=+crt-static", "-C", "link-self-contained=yes"]
